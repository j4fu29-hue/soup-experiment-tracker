name: soup-tracker

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: soup
      POSTGRES_USER: soup
      POSTGRES_PASSWORD: soup_local_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soup -d soup"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - soup-postgres:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=soup;Username=soup;Password=soup_local_dev;GSS Encryption Mode=Disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "Soup.Api.dll", "--healthcheck"]
      interval: 3s
      timeout: 2s
      retries: 20

volumes:
  soup-postgres:
