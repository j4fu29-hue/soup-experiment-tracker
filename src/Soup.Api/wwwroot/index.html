<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soup Experiments</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">MINI EXPERIMENT TRACKER</p>
      <h1>Soup</h1>
    </div>
    <span id="connection" class="status neutral">not connected</span>
  </header>

  <main>
    <section class="card setup">
      <div>
        <p class="eyebrow">PROJECT ACCESS</p>
        <h2>Connect a project</h2>
        <p class="muted">Create a local demo project or paste an existing API key.</p>
      </div>
      <form id="project-form">
        <label>Project name <input id="project-name" value="My experiments" maxlength="200" required></label>
        <button type="submit">Create project</button>
      </form>
      <label>API key
        <div class="input-row">
          <input id="api-key" type="password" autocomplete="off" placeholder="soup_…">
          <button id="save-key" type="button" class="secondary">Use key</button>
        </div>
      </label>
      <p id="message" class="message" aria-live="polite"></p>
    </section>

    <section class="workspace">
      <aside class="card">
        <div class="section-heading">
          <div><p class="eyebrow">RUNS</p><h2>Recent</h2></div>
          <button id="refresh-runs" class="icon" title="Refresh">↻</button>
        </div>
        <form id="run-form" class="input-row">
          <input id="run-name" placeholder="New run name" maxlength="200" required>
          <button type="submit">Add</button>
        </form>
        <div id="run-list" class="run-list"><p class="muted">Connect a project to load runs.</p></div>
      </aside>

      <section class="card detail">
        <div class="section-heading">
          <div><p class="eyebrow">LIVE RUN</p><h2 id="run-title">Select a run</h2></div>
          <span id="event-count" class="counter">0 events</span>
        </div>
        <canvas id="chart" width="900" height="320" aria-label="Metric chart"></canvas>
        <div class="table-wrap">
          <table>
            <thead><tr><th>sequence</th><th>metric</th><th>step</th><th>value</th><th>recorded</th></tr></thead>
            <tbody id="event-table"><tr><td colspan="5" class="muted">No run selected.</td></tr></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
